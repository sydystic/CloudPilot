# =====================================================================
# CloudPilot Development Environment — Docker Compose Configuration
#
# ARCHITECTURE OVERVIEW:
# ┌───────────────┐
# │    Browser    │
# └───────┬───────┘
#         │
#         ▼
# ┌───────────────┐
# │  CloudPilot   │ (Node/Express Host Process)
# │ Node/Express  │ N8N_URL=http://localhost:5678
# └──────┬────────┘
#        │
# ┌──────┴──────────────┐
# ▼                     ▼
# ┌─────────────┐   ┌─────────────┐
# │  Supabase   │   │     n8n     │ (Docker Container: n8n)
# │ PostgreSQL  │   │   Docker    │ Port: 5678
# └─────────────┘   └──────┬──────┘
#                          │
#                          ▼
#                   ┌─────────────┐
#                   │   n8n DB    │ (Docker Container: cloudpilot-n8n-db)
#                   │ PostgreSQL  │ Internal n8n state only
#                   └─────────────┘
#
# IMPORTANT DISTINCTION:
# - Supabase is CloudPilot's application database (user_workflows, credentials, etc.)
# - n8n PostgreSQL is n8n's internal database ONLY. Do not mix these databases!
# =====================================================================

services:
  # Internal PostgreSQL database dedicated to n8n state
  n8n-db:
    image: postgres:16-alpine
    container_name: cloudpilot-n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_db_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-n8n} -d $${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # n8n Workflow Automation Engine
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5680}:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_db_secret_password}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_PROTOCOL:-http}://${N8N_HOST:-localhost}:${N8N_PORT:-5680}/
      - GENERIC_TIMEZONE=${TZ:-Asia/Kolkata}
      - TZ=${TZ:-Asia/Kolkata}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  n8n_data:
    name: cloudpilot_n8n_data
  n8n_db_data:
    name: cloudpilot_n8n_db_data
