# =====================================================================
# CloudPilot Full Stack Docker Compose (Optional Containerized Backend)
#
# Use this configuration ONLY if you want to run the CloudPilot Express
# backend inside a Docker container alongside n8n and n8n-db.
#
# Command:
#   docker compose -f docker-compose.full.yml up -d
#
# IMPORTANT CONTAINER COMMUNICATION RULE:
# When CloudPilot backend runs inside Docker, N8N_URL MUST be set to
# http://n8n:5678 (using the Docker service name 'n8n'), NOT localhost!
# =====================================================================

services:
  # n8n Database
  n8n-db:
    image: postgres:16-alpine
    container_name: cloudpilot-n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_db_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-n8n} -d $${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # n8n Workflow Automation Service
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_db_secret_password}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_PROTOCOL:-http}://${N8N_HOST:-localhost}:${N8N_PORT:-5678}/
      - GENERIC_TIMEZONE=${TZ:-Asia/Kolkata}
      - TZ=${TZ:-Asia/Kolkata}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # CloudPilot Backend Express Application
  cloudpilot-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpilot-backend
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - PORT=4000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # CRITICAL: Inside Docker, talk to n8n container via service name 'n8n'
      - N8N_URL=http://n8n:5678
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_CONTAINER_NAME=n8n
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DEMO_MODE=${DEMO_MODE:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  n8n_data:
    name: cloudpilot_n8n_data
  n8n_db_data:
    name: cloudpilot_n8n_db_data
