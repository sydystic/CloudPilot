<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | CloudPilot</title>
<link rel="icon" type="image/svg+xml" href="./assets/cloudpilot-mark.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #0075de;
    --primary-dark: #005bab;
    --canvas-soft: #f6f5f4;
    --surface: #ffffff;
    --ink: #000000;
    --ink-secondary: #31302e;
    --ink-muted: #615d59;
    --ink-faint: #a39e98;
    --hairline: #e6e6e6;
    --radius-xs: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --shadow-card:
      rgba(0,0,0,0.01) 0 0.175px 1.041px,
      rgba(0,0,0,0.02) 0 0.8px 2.925px,
      rgba(0,0,0,0.027) 0 2.025px 7.847px,
      rgba(0,0,0,0.04) 0 4px 18px;
  }

  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: var(--canvas-soft);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    -webkit-font-smoothing: antialiased;
  }

  .signup-container {
    width: 100%;
    max-width: 420px;
  }

  /* ── Brand mark above card ── */
  .brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .brand-logo {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .brand-logo img { width: 32px; height: 32px; display: block; }

  .brand-wordmark {
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.4px;
  }

  .signup-card {
    background: var(--surface);
    border-radius: var(--radius-xl);
    padding: 32px;
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-card);
  }

  .card-heading {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.2px;
    margin-bottom: 4px;
  }

  .card-subheading {
    font-size: 14px;
    color: var(--ink-muted);
    margin-bottom: 24px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-secondary);
    margin-bottom: 6px;
  }

  .input-wrapper {
    position: relative;
  }

  .input-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-faint);
    font-size: 13px;
    pointer-events: none;
  }

  .form-input {
    width: 100%;
    padding: 10px 12px 10px 36px;
    border-radius: var(--radius-xs);
    border: 1px solid var(--hairline);
    background: var(--surface);
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .form-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(0, 117, 222, 0.08);
  }

  .form-input::placeholder { color: var(--ink-faint); }

  .password-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 14px;
    padding: 4px;
    transition: color 0.15s;
    line-height: 1;
  }

  .password-toggle:hover { color: var(--ink-muted); }

  .password-strength {
    margin-top: 8px;
    height: 3px;
    background: var(--hairline);
    border-radius: 2px;
    overflow: hidden;
    display: none;
  }

  .password-strength.show { display: block; }

  .strength-bar {
    height: 100%;
    width: 0;
    transition: width 0.3s ease, background 0.3s ease;
    border-radius: 2px;
  }

  .strength-weak { width: 33%; background: #dc2626; }
  .strength-medium { width: 66%; background: #dd5b00; }
  .strength-strong { width: 100%; background: #1aae39; }

  .password-hint {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 5px;
    line-height: 1.3;
  }

  .checkbox-group {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 20px;
    margin-top: 4px;
  }

  .checkbox-group input[type="checkbox"] {
    margin-top: 2px;
    accent-color: var(--primary);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }

  .checkbox-group label {
    font-size: 12px;
    color: var(--ink-secondary);
    cursor: pointer;
    line-height: 1.4;
  }

  .checkbox-group a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 500;
  }

  .checkbox-group a:hover { text-decoration: underline; }

  .btn-primary {
    width: 100%;
    background: var(--primary);
    color: #fff;
    padding: 11px 16px;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    border: none;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }

  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-primary:active:not(:disabled) { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }

  .divider span {
    font-size: 12px;
    color: var(--ink-faint);
    font-weight: 500;
    white-space: nowrap;
  }

  .social-buttons {
    display: grid;
    gap: 8px;
    margin-bottom: 20px;
  }

  .btn-social {
    width: 100%;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--hairline);
    background: var(--surface);
    color: var(--ink-secondary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-social:hover {
    background: var(--canvas-soft);
    border-color: #ccc;
  }

  .login-link {
    text-align: center;
    font-size: 13px;
    color: var(--ink-muted);
  }

  .login-link a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
  }

  .login-link a:hover { color: var(--primary-dark); }

  .alert {
    padding: 10px 14px;
    border-radius: var(--radius-md);
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
    align-items: center;
    gap: 8px;
    line-height: 1.4;
  }

  .alert.show { display: flex; }

  .alert-error {
    background: rgba(239, 68, 68, 0.06);
    color: #dc2626;
    border: 1px solid rgba(239, 68, 68, 0.2);
  }

  .alert-success {
    background: rgba(26, 174, 57, 0.06);
    color: #1aae39;
    border: 1px solid rgba(26, 174, 57, 0.2);
  }

  .alert-info {
    background: rgba(0, 117, 222, 0.06);
    color: var(--primary);
    border: 1px solid rgba(0, 117, 222, 0.2);
  }

  .spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .signup-card { padding: 24px 20px; }
  }
</style>
</head>
<body>

<div class="signup-container">
  <div class="brand-header">
    <div class="brand-logo">
      <img src="./assets/cloudpilot-mark.svg" alt="CloudPilot">
    </div>
    <span class="brand-wordmark">CloudPilot</span>
  </div>

  <div class="signup-card">
    <h1 class="card-heading">Create Account</h1>
    <p class="card-subheading">Start automating with CloudPilot today</p>

    <div id="alertBox" class="alert"></div>

    <form id="signupForm">
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <div class="input-wrapper">
          <i class="input-icon fas fa-user"></i>
          <input
            type="text"
            id="fullName"
            class="form-input"
            placeholder="John Doe"
            required
            autocomplete="name"
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-wrapper">
          <i class="input-icon fas fa-envelope"></i>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <i class="input-icon fas fa-lock"></i>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••"
            required
            autocomplete="new-password"
          >
          <button type="button" class="password-toggle" onclick="togglePassword('password', 'passwordIcon')">
            <i class="fas fa-eye" id="passwordIcon"></i>
          </button>
        </div>
        <div id="passwordStrength" class="password-strength">
          <div id="strengthBar" class="strength-bar"></div>
        </div>
        <div class="password-hint">Minimum 8 characters, including uppercase, lowercase, and numbers</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <i class="input-icon fas fa-lock"></i>
          <input
            type="password"
            id="confirmPassword"
            class="form-input"
            placeholder="••••••••"
            required
            autocomplete="new-password"
          >
          <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', 'confirmIcon')">
            <i class="fas fa-eye" id="confirmIcon"></i>
          </button>
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="terms" required>
        <label for="terms">
          I agree to the <a href="#" onclick="alert('Terms coming soon!'); return false;">Terms of Service</a> and <a href="#" onclick="alert('Privacy Policy coming soon!'); return false;">Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        <span id="btnText">Create Account</span>
      </button>
    </form>

    <div class="divider">
      <span>Or sign up with</span>
    </div>

    <div class="social-buttons">
      <button class="btn-social" onclick="handleGoogleSignup()">
        <i class="fab fa-google"></i>
        <span>Google</span>
      </button>
      <button class="btn-social" onclick="handleGithubSignup()">
        <i class="fab fa-github"></i>
        <span>GitHub</span>
      </button>
    </div>

    <div class="login-link">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
  import { getConfig } from './config.js';

  let supabase;

  try {
    const config = await getConfig();
    if (config.supabase?.url && config.supabase?.anonKey) {
      supabase = createClient(config.supabase.url, config.supabase.anonKey);
      window.supabase = supabase;

      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = 'index.html';
      }
    } else if (config.demoMode) {
      showAlert('Demo mode active.', 'info');
    } else {
      showAlert('Supabase URL or Anon Key is missing. Check .env file.', 'error');
    }
  } catch (err) {
    showAlert('Configuration error: ' + err.message, 'error');
  }

  // Password strength checker
  document.getElementById('password').addEventListener('input', function(e) {
    const password = e.target.value;
    const strengthBar = document.getElementById('strengthBar');
    const strengthContainer = document.getElementById('passwordStrength');

    if (password.length === 0) {
      strengthContainer.classList.remove('show');
      return;
    }

    strengthContainer.classList.add('show');

    let strength = 0;
    if (password.length >= 8) strength++;
    if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
    if (/\d/.test(password)) strength++;
    if (/[@$!%*?&]/.test(password)) strength++;

    strengthBar.className = 'strength-bar';
    if (strength <= 1) {
      strengthBar.classList.add('strength-weak');
    } else if (strength <= 2) {
      strengthBar.classList.add('strength-medium');
    } else {
      strengthBar.classList.add('strength-strong');
    }
  });

  // Form submission
  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const fullName = document.getElementById('fullName').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const terms = document.getElementById('terms').checked;
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    if (!terms) {
      showAlert('Please accept the Terms of Service', 'error');
      return;
    }

    if (password !== confirmPassword) {
      showAlert('Passwords do not match', 'error');
      return;
    }

    if (password.length < 8) {
      showAlert('Password must be at least 8 characters', 'error');
      return;
    }

    submitBtn.disabled = true;
    btnText.innerHTML = '<div class="spinner"></div><span>Creating account...</span>';

    try {
      if (!supabase) {
        const config = await getConfig().catch(() => ({ demoMode: true }));
        if (config.demoMode) {
          showAlert('Account created in Demo Mode! Redirecting to login...', 'success');
          setTimeout(() => { window.location.href = 'login.html'; }, 1500);
          return;
        }
        throw new Error('Supabase client not initialized. Check server configuration.');
      }

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName
          }
        }
      });

      if (error) throw error;

      showAlert('Account created! Please check your email to verify your account or sign in.', 'success');

      document.getElementById('signupForm').reset();
      document.getElementById('passwordStrength').classList.remove('show');

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);

    } catch (error) {
      showAlert(error.message, 'error');
      submitBtn.disabled = false;
      btnText.textContent = 'Create Account';
    }
  });

  // Password toggle
  window.togglePassword = function(inputId, iconId) {
    const passwordInput = document.getElementById(inputId);
    const passwordIcon = document.getElementById(iconId);

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      passwordIcon.classList.remove('fa-eye');
      passwordIcon.classList.add('fa-eye-slash');
    } else {
      passwordInput.type = 'password';
      passwordIcon.classList.remove('fa-eye-slash');
      passwordIcon.classList.add('fa-eye');
    }
  };

  // Social signup handlers
  window.handleGoogleSignup = async function() {
    try {
      if (!supabase) throw new Error('Supabase is not configured on server');
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + '/index.html'
        }
      });
      if (error) throw error;
    } catch (error) {
      showAlert(error.message, 'error');
    }
  };

  window.handleGithubSignup = async function() {
    try {
      if (!supabase) throw new Error('Supabase is not configured on server');
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'github',
        options: {
          redirectTo: window.location.origin + '/index.html'
        }
      });
      if (error) throw error;
    } catch (error) {
      showAlert(error.message, 'error');
    }
  };

  // Alert helper
  function showAlert(message, type) {
    const alertBox = document.getElementById('alertBox');
    alertBox.className = `alert alert-${type} show`;
    alertBox.innerHTML = `
      <i class="fas fa-${type === 'error' ? 'exclamation-circle' : type === 'success' ? 'check-circle' : 'info-circle'}"></i>
      <span>${message}</span>
    `;
  }
</script>

</body>
</html>
