<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | CloudPilot</title>
<link rel="icon" type="image/svg+xml" href="./assets/cloudpilot-mark.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #0075de;
    --primary-dark: #005bab;
    --canvas-soft: #f6f5f4;
    --surface: #ffffff;
    --ink: #000000;
    --ink-secondary: #31302e;
    --ink-muted: #615d59;
    --ink-faint: #a39e98;
    --hairline: #e6e6e6;
    --radius-xs: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --shadow-card:
      rgba(0,0,0,0.01) 0 0.175px 1.041px,
      rgba(0,0,0,0.02) 0 0.8px 2.925px,
      rgba(0,0,0,0.027) 0 2.025px 7.847px,
      rgba(0,0,0,0.04) 0 4px 18px;
  }

  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: var(--canvas-soft);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    -webkit-font-smoothing: antialiased;
  }

  .login-container {
    width: 100%;
    max-width: 400px;
  }

  /* ── Brand mark above card ── */
  .brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .brand-logo {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .brand-logo img { width: 32px; height: 32px; display: block; }

  .brand-wordmark {
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.4px;
  }

  .login-card {
    background: var(--surface);
    border-radius: var(--radius-xl);
    padding: 32px;
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-card);
  }

  .card-heading {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.2px;
    margin-bottom: 4px;
  }

  .card-subheading {
    font-size: 14px;
    color: var(--ink-muted);
    margin-bottom: 24px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-secondary);
    margin-bottom: 6px;
  }

  .input-wrapper {
    position: relative;
  }

  .input-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-faint);
    font-size: 13px;
    pointer-events: none;
  }

  .form-input {
    width: 100%;
    padding: 10px 12px 10px 36px;
    border-radius: var(--radius-xs);
    border: 1px solid var(--hairline);
    background: var(--surface);
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .form-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(0, 117, 222, 0.08);
  }

  .form-input::placeholder { color: var(--ink-faint); }

  .password-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 14px;
    padding: 4px;
    transition: color 0.15s;
    line-height: 1;
  }

  .password-toggle:hover { color: var(--ink-muted); }

  .forgot-password {
    text-align: right;
    margin-top: -8px;
    margin-bottom: 20px;
  }

  .forgot-password a {
    font-size: 12px;
    color: var(--primary);
    text-decoration: none;
    font-weight: 500;
  }

  .forgot-password a:hover { color: var(--primary-dark); }

  .btn-primary {
    width: 100%;
    background: var(--primary);
    color: #fff;
    padding: 11px 16px;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    border: none;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }

  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-primary:active:not(:disabled) { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }

  .divider span {
    font-size: 12px;
    color: var(--ink-faint);
    font-weight: 500;
    white-space: nowrap;
  }

  .social-buttons {
    display: grid;
    gap: 8px;
    margin-bottom: 20px;
  }

  .btn-social {
    width: 100%;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--hairline);
    background: var(--surface);
    color: var(--ink-secondary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-social:hover {
    background: var(--canvas-soft);
    border-color: #ccc;
  }

  .signup-link {
    text-align: center;
    font-size: 13px;
    color: var(--ink-muted);
  }

  .signup-link a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
  }

  .signup-link a:hover { color: var(--primary-dark); }

  .alert {
    padding: 10px 14px;
    border-radius: var(--radius-md);
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
    align-items: center;
    gap: 8px;
    line-height: 1.4;
  }

  .alert.show { display: flex; }

  .alert-error {
    background: rgba(239, 68, 68, 0.06);
    color: #dc2626;
    border: 1px solid rgba(239, 68, 68, 0.2);
  }

  .alert-success {
    background: rgba(26, 174, 57, 0.06);
    color: #1aae39;
    border: 1px solid rgba(26, 174, 57, 0.2);
  }

  .alert-info {
    background: rgba(0, 117, 222, 0.06);
    color: var(--primary);
    border: 1px solid rgba(0, 117, 222, 0.2);
  }

  .spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .login-card { padding: 24px 20px; }
  }

  /* Modal overlay for Password Reset */
  .auth-modal-overlay {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(2px);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .auth-modal-overlay.active { display: flex; }
  .auth-modal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
    width: 100%; max-width: 420px;
    padding: 28px 24px;
    position: relative;
  }
  .auth-modal-close {
    position: absolute; top: 16px; right: 16px;
    background: none; border: none; font-size: 16px;
    color: var(--ink-muted); cursor: pointer;
  }
  .auth-modal-close:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="login-container">
  <div class="brand-header">
    <div class="brand-logo">
      <img src="./assets/cloudpilot-mark.svg" alt="CloudPilot">
    </div>
    <span class="brand-wordmark">CloudPilot</span>
  </div>

  <div class="login-card">
    <h1 class="card-heading">Welcome back</h1>
    <p class="card-subheading">Sign in to your CloudPilot account</p>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-wrapper">
          <i class="input-icon fas fa-envelope"></i>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <i class="input-icon fas fa-lock"></i>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
          <button type="button" class="password-toggle" onclick="togglePassword()">
            <i class="fas fa-eye" id="passwordIcon"></i>
          </button>
        </div>
      </div>

      <div class="forgot-password">
        <a href="#" onclick="openForgotPassword(); return false;">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        <span id="btnText">Sign In</span>
      </button>
    </form>

    <div class="divider">
      <span>Or continue with</span>
    </div>

    <div class="social-buttons">
      <button class="btn-social" onclick="handleGoogleLogin()">
        <i class="fab fa-google"></i>
        <span>Google</span>
      </button>
      <button class="btn-social" onclick="handleGithubLogin()">
        <i class="fab fa-github"></i>
        <span>GitHub</span>
      </button>
    </div>

    <div class="signup-link">
      Don't have an account? <a href="signup.html">Sign up</a>
    </div>
  </div>
</div>

<!-- Forgot Password Modal -->
<div class="auth-modal-overlay" id="forgotModal">
  <div class="auth-modal-card">
    <button class="auth-modal-close" onclick="closeForgotPassword()"><i class="fas fa-times"></i></button>
    <h2 class="card-heading" style="font-size:18px;margin-bottom:6px">Reset Password</h2>
    <p class="card-subheading" style="font-size:13px;margin-bottom:16px">Enter your account email to receive a password reset link.</p>
    <div id="forgotAlert" class="alert"></div>
    <form id="forgotForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrapper">
          <i class="input-icon fas fa-envelope"></i>
          <input type="email" id="forgotEmail" class="form-input" placeholder="you@example.com" required>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="forgotSubmitBtn">
        <span id="forgotBtnText">Send Reset Link</span>
      </button>
    </form>
  </div>
</div>

<!-- Set New Password Modal (Callback from recovery link) -->
<div class="auth-modal-overlay" id="recoveryModal">
  <div class="auth-modal-card">
    <h2 class="card-heading" style="font-size:18px;margin-bottom:6px">Create New Password</h2>
    <p class="card-subheading" style="font-size:13px;margin-bottom:16px">Your reset token is verified. Please set a new password.</p>
    <div id="recoveryAlert" class="alert"></div>
    <form id="recoveryForm">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <div class="input-wrapper">
          <i class="input-icon fas fa-lock"></i>
          <input type="password" id="newPassword" class="form-input" placeholder="Min. 8 characters" minlength="8" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <div class="input-wrapper">
          <i class="input-icon fas fa-lock"></i>
          <input type="password" id="confirmNewPassword" class="form-input" placeholder="Confirm password" minlength="8" required>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="recoverySubmitBtn">
        <span id="recoveryBtnText">Update Password</span>
      </button>
    </form>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
  import { getConfig } from './config.js';

  let supabase;

  try {
    const config = await getConfig();
    if (config.supabase?.url && config.supabase?.anonKey) {
      supabase = createClient(config.supabase.url, config.supabase.anonKey);
      window.supabase = supabase;

      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = 'index.html';
      }
    } else if (config.demoMode) {
      showAlert('Demo mode active. Enter any email to sign in.', 'info');
    } else {
      showAlert('Supabase URL or Anon Key is missing. Check .env file.', 'error');
    }
  } catch (err) {
    showAlert('Configuration error: ' + err.message, 'error');
  }

  // Form submission
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    submitBtn.disabled = true;
    btnText.innerHTML = '<div class="spinner"></div><span>Signing in...</span>';

    try {
      if (!supabase) {
        const config = await getConfig().catch(() => ({ demoMode: true }));
        if (config.demoMode) {
          showAlert('Success! Demo Mode Active. Redirecting...', 'success');
          setTimeout(() => { window.location.href = 'index.html'; }, 800);
          return;
        }
        throw new Error('Supabase client not initialized. Check server configuration.');
      }

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      showAlert('Success! Redirecting...', 'success');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 800);

    } catch (error) {
      showAlert(error.message, 'error');
      submitBtn.disabled = false;
      btnText.textContent = 'Sign In';
    }
  });

  // Password toggle
  window.togglePassword = function() {
    const passwordInput = document.getElementById('password');
    const passwordIcon = document.getElementById('passwordIcon');

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      passwordIcon.classList.remove('fa-eye');
      passwordIcon.classList.add('fa-eye-slash');
    } else {
      passwordInput.type = 'password';
      passwordIcon.classList.remove('fa-eye-slash');
      passwordIcon.classList.add('fa-eye');
    }
  };

  // Password reset modal helpers
  window.openForgotPassword = function() {
    const modal = document.getElementById('forgotModal');
    if (modal) {
      modal.classList.add('active');
      document.getElementById('forgotEmail').value = document.getElementById('email').value || '';
    }
  };

  window.closeForgotPassword = function() {
    const modal = document.getElementById('forgotModal');
    if (modal) modal.classList.remove('active');
  };

  // Submit password reset request
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('forgotEmail').value.trim();
    const btn = document.getElementById('forgotSubmitBtn');
    const btnText = document.getElementById('forgotBtnText');
    const alertEl = document.getElementById('forgotAlert');

    if (!email) return;

    btn.disabled = true;
    btnText.innerHTML = '<div class="spinner"></div><span>Sending...</span>';

    try {
      if (!supabase) throw new Error('Authentication service not initialized');
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/login.html'
      });
      if (error) throw error;

      alertEl.className = 'alert alert-success show';
      alertEl.innerHTML = '<i class="fas fa-check-circle"></i><span>Password reset link sent! Please check your email.</span>';
      setTimeout(() => {
        closeForgotPassword();
        showAlert('Password reset link sent to ' + email, 'info');
      }, 2500);
    } catch (err) {
      alertEl.className = 'alert alert-error show';
      alertEl.innerHTML = `<i class="fas fa-exclamation-circle"></i><span>${err.message}</span>`;
    } finally {
      btn.disabled = false;
      btnText.textContent = 'Send Reset Link';
    }
  });

  // Submit new password from recovery link
  document.getElementById('recoveryForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmNewPassword').value;
    const btn = document.getElementById('recoverySubmitBtn');
    const btnText = document.getElementById('recoveryBtnText');
    const alertEl = document.getElementById('recoveryAlert');

    if (newPassword !== confirmPassword) {
      alertEl.className = 'alert alert-error show';
      alertEl.innerHTML = '<i class="fas fa-exclamation-circle"></i><span>Passwords do not match</span>';
      return;
    }
    if (newPassword.length < 8) {
      alertEl.className = 'alert alert-error show';
      alertEl.innerHTML = '<i class="fas fa-exclamation-circle"></i><span>Password must be at least 8 characters</span>';
      return;
    }

    btn.disabled = true;
    btnText.innerHTML = '<div class="spinner"></div><span>Updating...</span>';

    try {
      if (!supabase) throw new Error('Authentication service not initialized');
      const { error } = await supabase.auth.updateUser({ password: newPassword });
      if (error) throw error;

      alertEl.className = 'alert alert-success show';
      alertEl.innerHTML = '<i class="fas fa-check-circle"></i><span>Password updated successfully! Redirecting...</span>';
      setTimeout(() => {
        window.location.hash = '';
        window.location.href = 'index.html';
      }, 1500);
    } catch (err) {
      alertEl.className = 'alert alert-error show';
      alertEl.innerHTML = `<i class="fas fa-exclamation-circle"></i><span>${err.message}</span>`;
      btn.disabled = false;
      btnText.textContent = 'Update Password';
    }
  });

  // Check if landing from password recovery link
  if (window.location.hash.includes('type=recovery')) {
    const recoveryModal = document.getElementById('recoveryModal');
    if (recoveryModal) recoveryModal.classList.add('active');
  }

  // Social login handlers
  window.handleGoogleLogin = async function() {
    try {
      if (!supabase) throw new Error('Supabase is not configured on server');
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + '/index.html'
        }
      });
      if (error) {
        if (error.message?.includes('provider is not enabled') || error.message?.includes('validation_failed')) {
          throw new Error('Google OAuth is not enabled in your Supabase project. Enable Google in Supabase Dashboard (Authentication > Providers > Google) with your Google Cloud OAuth Client ID & Secret.');
        }
        throw error;
      }
    } catch (error) {
      showAlert(error.message, 'error');
    }
  };

  window.handleGithubLogin = async function() {
    try {
      if (!supabase) throw new Error('Supabase is not configured on server');
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'github',
        options: {
          redirectTo: window.location.origin + '/index.html'
        }
      });
      if (error) throw error;
    } catch (error) {
      showAlert(error.message, 'error');
    }
  };

  // Alert helper
  function showAlert(message, type) {
    const alertBox = document.getElementById('alertBox');
    alertBox.className = `alert alert-${type} show`;
    alertBox.innerHTML = `
      <i class="fas fa-${type === 'error' ? 'exclamation-circle' : type === 'success' ? 'check-circle' : 'info-circle'}"></i>
      <span>${message}</span>
    `;

    if (type === 'success') {
      setTimeout(() => {
        alertBox.classList.remove('show');
      }, 4000);
    }
  }
</script>

</body>
</html>
